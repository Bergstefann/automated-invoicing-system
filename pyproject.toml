[project]
name = "automated-invoicing-system"
version = "0.1.0"
description = "Fortnightly tutoring invoicing pipeline: SQLite source of truth, Google Sheets human view."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
invoicing = "invoicing.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicing"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true
# These ship real, importable source with no type annotations (no py.typed
# marker), so mypy strict's disallow_untyped_calls flags every call into
# them once the caller-side variable is properly typed instead of Any.
# follow_imports = "skip" treats the whole module as Any without inspecting
# its unannotated body, which is the standard escape hatch for this.
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/invoicing"]
